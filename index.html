<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <style>
        /* General page styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        /* Main card container */
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 900px;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* Header layout */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f4f7f6;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        h1 {
            color: #2c3e50;
            margin: 0;
            font-size: 24px;
        }

        h2 {
            color: #2c3e50;
            font-size: 18px;
            margin-bottom: 15px;
        }

        /* Button styling */
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #004494;
            transform: translateY(-1px);
        }

        /* Table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 6px;
            overflow: hidden;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #f1f3f5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-section">
            <h1>Student Management System</h1>
            <button>Login</button>
        </div>

        <h2>Student Records</h2>
        <table>
            <tr>
                <th>Student No.</th>
                <th>Name</th>
                <th>Course</th>
                <th>Year Level</th>
                <th>Email</th>
            </tr>
            <tr>
                <td>2026-001</td>
                <td>Juan Dela Cruz</td>
                <td>BSIT</td>
                <td>2nd Year</td>
                <td>juan@example.com</td>
            </tr>
        </table>
    </div>
</body>
</html>
