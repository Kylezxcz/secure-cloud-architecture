<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <style>
        /* General page styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 40px auto; /* Centers the content */
            padding: 0 20px;
        }

        /* Typography */
        h1, h2 {
            color: #2c3e50;
        }

        /* Button styling */
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 20px;
        }

        button:hover {
            background-color: #004494;
        }

        /* Table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden; /* Keeps the rounded corners neat */
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eeeeee;
        }

        th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Student Management System</h1>
    <button>Login</button>

    <h2>Student Records</h2>
    <table>
        <tr>
            <th>Student No.</th>
            <th>Name</th>
            <th>Course</th>
            <th>Year Level</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>2026-001</td>
            <td>Juan Dela Cruz</td>
            <td>BSIT</td>
            <td>2nd Year</td>
            <td>juan@example.com</td>
        </tr>
    </table>
</body>
</html>
